[project]
name = "moonlit"
version = "0.1.0"
description = "uv-powered Python zipapp builder."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Phil Harrison" },
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
]

[project.scripts]
moonlit = "moonlit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moonlit"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
docs = [
    "zensical>=0.0.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["site"]

[tool.ruff.lint]
# E/W: pycodestyle. F: pyflakes. I: isort. UP: pyupgrade. B: bugbear. RUF: ruff-specific.
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
# E501 (line too long) is enforced by `ruff format` instead — disable the lint rule
# so wrapping decisions come from one tool, not two.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use long parametrize values + bare assertions; relax a few rules.
"tests/**" = ["B011"]
