[project]
name = "moonlit"
version = "0.1.0"
description = "uv-powered Python zipapp builder."
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
]

[project.scripts]
moonlit = "moonlit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moonlit"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
docs = [
    "zensical>=0.0.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
