[project]

site_name = "moonlit"
site_description = "uv-powered Python zipapp builder."
site_author = "Phil Harrison"

# Top-right header link. `repo_name` is the visible link text; zensical
# auto-derives "GitHub" when omitted, but we set it explicitly so the
# overrides/partials/source.html partial can append `extra.version`.
repo_url = "https://github.com/OpenAfterHours/moonlit"
repo_name = "OpenAfterHours/moonlit"

# Bump alongside pyproject.toml and src/moonlit/__init__.py at each release.
# Surfaced in the top-right header next to the repo link via
# overrides/partials/source.html.
[project.extra]
version = "0.4.2"

# nav is explicit so the spec's intended ordering is preserved (CLAUDE.md
# initial docs scope: index → getting-started → cli-reference → runtime).
nav = [
    { "Overview" = "index.md" },
    { "Getting started" = "getting-started.md" },
    { "CLI reference" = "cli-reference.md" },
    { "Runtime" = "runtime.md" },
]

copyright = """
Copyright &copy; 2026 Phil Harrison
"""


[project.theme]
language = "en"
custom_dir = "overrides"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]


[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
primary = "orange"
accent = "orange"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "orange"
accent = "orange"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"


# Markdown extensions: the same default set zensical scaffolds, since the docs
# use admonitions, tabs, and fenced code blocks with syntax highlighting.

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
