[package]
name = "moonlit-launcher"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Native Windows launcher prepended to moonlit zipapps."

[[bin]]
# Name picked to match the artifact convention: t-{x86,x64,arm64}.exe under
# src/moonlit/_launchers/. The bin name is "t" (console / "terminal" launcher);
# rename per arch happens at vendoring time.
name = "t"
path = "src/main.rs"

[profile.release]
# Smallest possible artifact: every byte ships in front of every produced .exe.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[dependencies]
# CreateProcessW takes SECURITY_ATTRIBUTES pointers, so Win32_Security is needed
# alongside Win32_System_Threading; otherwise its binding is gated out.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
